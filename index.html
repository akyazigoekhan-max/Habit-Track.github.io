<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Habit Tracker</title>
<style>
  body { font-family: sans-serif; background: #f0f4f8; color: #333; }
  .tabs { display: flex; gap: 10px; margin-bottom: 10px; }
  .tab { padding: 5px 10px; background: #ddd; border-radius: 5px; cursor: pointer; }
  .tab.active { background: #4a90e2; color: white; }
  .content { padding: 10px; background: white; border-radius: 5px; min-height: 200px; }
</style>
</head>
<body>

<div class="tabs">
  <div class="tab active" data-tab="habits">Habits</div>
  <div class="tab" data-tab="kalender">Kalender</div>
  <div class="tab" data-tab="statistik">Statistik</div>
  <div class="tab" data-tab="timer">Timer</div>
  <div class="tab" data-tab="routinen">Routinen</div>
</div>

<div class="content" id="content">
  Willkommen beim Habit Tracker! Wähle einen Tab oben.
</div>

<script>
const tabs = document.querySelectorAll('.tab');
const content = document.getElementById('content');

tabs.forEach(tab => {
  tab.addEventListener('click', () => {
    tabs.forEach(t => t.classList.remove('active'));
    tab.classList.add('active');

    switch(tab.dataset.tab) {
      case 'habits':
        content.innerHTML = '<h2>Habits</h2><p>Hier kannst du deine Gewohnheiten sehen.</p>';
        break;
      case 'kalender':
        content.innerHTML = '<h2>Kalender</h2><p>Monats- und Tagesansicht hier.</p>';
        break;
      case 'statistik':
        content.innerHTML = '<h2>Statistik</h2><p>Diagramme und Streaks hier.</p>';
        break;
      case 'timer':
        content.innerHTML = '<h2>Timer</h2><p>Fokus-Timer hier.</p>';
        break;
      case 'routinen':
        content.innerHTML = '<h2>Routinen</h2><p>Routinen planen hier.</p>';
        break;
      default:
        content.innerHTML = '';
    }
  });
});
</script>

</body>
</html>
