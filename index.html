<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OpenHabit Web</title>
  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Chart.js für Statistik -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: sans-serif; background:#f7f7f7; }
    .glass { background: rgba(255,255,255,0.8); box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
  </style>
</head>
<body class="h-screen flex flex-col">
  <div id="root" class="flex-1"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    /* ---------------- TIMER ---------------- */
    function Timer() {
      const [mode, setMode] = useState("work");
      const [minutes, setMinutes] = useState(25);
      const [seconds, setSeconds] = useState(0);
      const [running, setRunning] = useState(false);

      useEffect(() => {
        if (!running) return;
        const int = setInterval(() => {
          if (seconds > 0) setSeconds(s => s - 1);
          else if (minutes > 0) { setMinutes(m => m - 1); setSeconds(59); }
          else {
            clearInterval(int);
            if (mode === "work") {
              alert("Arbeitszeit vorbei – Pause auswählen!");
              setMode("pause"); setMinutes(5); setSeconds(0); setRunning(false);
            } else {
              alert("Pause vorbei – starte neue Arbeitszeit!");
              setMode("work"); setMinutes(25); setSeconds(0); setRunning(false);
            }
          }
        }, 1000);
        return () => clearInterval(int);
      }, [running, seconds, minutes, mode]);

      return (
        <div className="p-4 glass rounded-3xl">
          <h2 className="text-xl font-bold mb-2">{mode==="work"?"Arbeitszeit":"Pause"}</h2>
          <div className="text-4xl mb-4">{minutes}:{seconds.toString().padStart(2,"0")}</div>
          <div className="flex gap-2">
            <button onClick={()=>setRunning(r=>!r)} className="px-4 py-2 bg-sky-600 text-white rounded">
              {running?"Stop":"Start"}
            </button>
            {mode==="work" && (
              <select value={minutes} onChange={e=>setMinutes(Number(e.target.value))} className="px-2 rounded">
                {[...Array(90)].map((_,i)=><option key={i+1} value={i+1}>{i+1} Min</option>)}
              </select>
            )}
            {mode==="pause" && (
              <select value={minutes} onChange={e=>setMinutes(Number(e.target.value))} className="px-2 rounded">
                {[5,10,15,20].map(m=><option key={m} value={m}>{m} Min</option>)}
              </select>
            )}
          </div>
        </div>
      );
    }

    /* ------------- HABITS MIT UNTERPUNKTE ------------- */
    function HabitCard({habit,onLog,onArchive,onAddSubtask,onToggleSubtask}) {
      const today=new Date().toISOString().slice(0,10);
      const count=habit.logs?.[today]||0;
      return (
        <div className="rounded-3xl p-4 glass mb-3">
          <div className="flex justify-between items-center">
            <div className="font-semibold">{habit.name} <span className="opacity-70">({habit.unit||"Einheiten"})</span></div>
            <div className="flex gap-2 items-center">
              <button onClick={()=>onLog(habit.id,-1)} className="px-2">-</button>
              <span>{count}/{habit.goal}</span>
              <button onClick={()=>onLog(habit.id,1)} className="px-2">+</button>
            </div>
          </div>

          {/* Unterpunkte */}
          <div className="mt-2">
            {habit.subtasks?.map((st,i)=>(
              <div key={i} className="flex items-center gap-2">
                <input type="checkbox" checked={st.done?.[today]||false} 
                  onChange={()=>onToggleSubtask(habit.id,i,today)}/>
                <span>{st.text}</span>
              </div>
            ))}
            <button onClick={()=>{const txt=prompt("Unterpunkt hinzufügen:"); if(txt) onAddSubtask(habit.id,txt);}}
              className="text-sm text-sky-600">+ Unterpunkt</button>
          </div>

          <button onClick={()=>onArchive(habit.id)} className="mt-2 px-3 py-1 bg-rose-600 text-white rounded">Archivieren</button>
        </div>
      )
    }

    /* ----------------- STATISTIK ----------------- */
    function Stats({habits}) {
      useEffect(()=>{
        const ctx=document.getElementById("statsChart");
        if(!ctx) return;
        new Chart(ctx,{type:"bar",data:{
          labels:habits.map(h=>h.name),
          datasets:[{label:"% Erfüllung",data:habits.map(h=>{
            const logs=Object.values(h.logs||{});
            if(!logs.length) return 0;
            const done=logs.filter(v=>v>=h.goal).length;
            return Math.round(done/logs.length*100);
          }),backgroundColor:"rgba(14,165,233,0.7)"}]
        }});
      },[habits]);
      return <canvas id="statsChart" height="200"></canvas>;
    }

    /* ---------------- KALENDER ---------------- */
    function CalendarView({events,setEvents}) {
      const [date,setDate]=useState(new Date().toISOString().slice(0,10));
      const todays=events[date]||[];
      const addEvent=()=>{
        const time=prompt("Uhrzeit (z.B. 08:30)");
        const text=prompt("Beschreibung");
        if(time&&text){
          setEvents(e=>({...e,[date]:[...(e[date]||[]),{time,text}]}));
        }
      };
      return (
        <div className="p-4 glass rounded-3xl">
          <h2 className="text-xl font-bold mb-2">Tagesplan</h2>
          <input type="date" value={date} onChange={e=>setDate(e.target.value)} className="mb-2"/>
          <ul>{todays.map((ev,i)=><li key={i}>{ev.time} – {ev.text}</li>)}</ul>
          <button onClick={addEvent} className="mt-2 px-3 py-1 bg-sky-600 text-white rounded">+ Termin</button>
        </div>
      );
    }

    /* ----------------- APP ----------------- */
    function App(){
      const [state,setState]=useState(()=>JSON.parse(localStorage.getItem("oh_state_v2"))||{habits:[],events:{}});
      const [tab,setTab]=useState("habits"); // habits | timer | stats | calendar
      useEffect(()=>localStorage.setItem("oh_state_v2",JSON.stringify(state)),[state]);

      const addHabit=()=>{const n=prompt("Name der Gewohnheit"); if(!n)return;
        const unit=prompt("Einheit (Seiten, Minuten, etc.)")||"Einheiten";
        setState(s=>({...s,habits:[...s.habits,{id:Date.now(),name:n,unit,goal:1,logs:{},subtasks:[]}]}));
      };

      const log=(id,d)=>setState(s=>({...s,habits:s.habits.map(h=>{
        if(h.id!==id)return h; const dStr=new Date().toISOString().slice(0,10);
        const logs={...h.logs,[dStr]:Math.max(0,(h.logs?.[dStr]||0)+d)}; return {...h,logs};
      })}));

      const addSubtask=(id,txt)=>setState(s=>({...s,habits:s.habits.map(h=>h.id===id?{...h,subtasks:[...(h.subtasks||[]),{text:txt,done:{}}]}:h)}));
      const toggleSubtask=(id,idx,date)=>setState(s=>({...s,habits:s.habits.map(h=>{
        if(h.id!==id)return h; const subs=[...h.subtasks]; const st=subs[idx];
        st.done={...(st.done||{}),[date]:!(st.done?.[date])}; subs[idx]=st;
        return {...h,subtasks:subs};
      })}));

      return (
        <div className="h-full flex flex-col">
          <header className="p-4 flex gap-4 bg-sky-600 text-white">
            <button onClick={()=>setTab("habits")}>Gewohnheiten</button>
            <button onClick={()=>setTab("timer")}>Timer</button>
            <button onClick={()=>setTab("stats")}>Statistik</button>
            <button onClick={()=>setTab("calendar")}>Kalender</button>
          </header>
          <main className="p-4 flex-1 overflow-y-auto">
            {tab==="habits" && (
              <div>
                <button onClick={addHabit} className="mb-2 px-3 py-1 bg-sky-600 text-white rounded">+ Gewohnheit</button>
                {state.habits.map(h=><HabitCard key={h.id} habit={h} onLog={log} onArchive={()=>{}} onAddSubtask={addSubtask} onToggleSubtask={toggleSubtask}/>)}
              </div>
            )}
            {tab==="timer" && <Timer/>}
            {tab==="stats" && <Stats habits={state.habits}/>}
            {tab==="calendar" && <CalendarView events={state.events} setEvents={e=>setState(s=>({...s,events:e}))}/>}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
