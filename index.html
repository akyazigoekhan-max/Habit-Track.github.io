<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OpenHabit – Web Habit Tracker</title>
  <meta name="description" content="Ein freier, quelloffener Habit-Tracker für das Web – ohne Limits."/>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0ea5e9"/>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256'><rect width='256' height='256' rx='56' fill='%230ea5e9'/><path d='M188 84l-74 88-46-40' fill='none' stroke='white' stroke-width='18' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 + ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel für JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    html, body, #root { height: 100%; }
    .glass { backdrop-filter: blur(10px); background: rgba(255,255,255,0.7); }
    .dark .glass { background: rgba(0,0,0,0.35); }
    .calendar-cell { width: 18px; height: 18px; }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100">
  <noscript>Diese App benötigt JavaScript.</noscript>
  <div id="root" class="h-full"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const uid = () => crypto.randomUUID ? crypto.randomUUID() : (Date.now() + '_' + Math.random().toString(16).slice(2));
    const todayISO = () => new Date().toISOString().slice(0,10);
    const fmt = (d) => d.toISOString().slice(0,10);
    const dateAdd = (d, days) => { const x = new Date(d); x.setDate(x.getDate()+days); return x; };
    const clamp = (n,min,max)=>Math.max(min,Math.min(max,n));

    // ----- LocalStorage -----
    const loadState = () => {
      try { return JSON.parse(localStorage.getItem('openhabit_state_v1')) || { habits: [], settings: { theme: 'system' } }; }
      catch { return { habits: [], settings: { theme: 'system' } }; }
    };
    const saveState = (s) => localStorage.setItem('openhabit_state_v1', JSON.stringify(s));

    // ----- UI Komponenten -----
    function ThemeController({settings,setSettings}){
      useEffect(()=>{
        const prefers = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const t = settings.theme==='system' ? (prefers?'dark':'light') : settings.theme;
        document.documentElement.classList.toggle('dark', t==='dark');
      },[settings.theme]);
      return (
        <select value={settings.theme} onChange={e=>setSettings(s=>({...s,theme:e.target.value}))}
          className="px-2 py-1 rounded-xl bg-slate-200/60 dark:bg-slate-800/60">
          <option value="system">System</option>
          <option value="light">Hell</option>
          <option value="dark">Dunkel</option>
        </select>
      )
    }

    function HabitForm({onCreate}){
      const [name,setName]=useState('');
      const [color,setColor]=useState('#0ea5e9');
      const [goal,setGoal]=useState(1);
      const [period,setPeriod]=useState('day');
      const submit=(e)=>{e.preventDefault();
        if(!name.trim()) return;
        onCreate({id:uid(),name:name.trim(),color,goal:parseInt(goal),period,logs:{},createdAt:Date.now(),archived:false});
        setName('');
      };
      return (
        <form onSubmit={submit} className="flex gap-2 flex-wrap">
          <input value={name} onChange={e=>setName(e.target.value)} placeholder="Neue Gewohnheit…" className="px-3 py-2 rounded-2xl bg-slate-100 dark:bg-slate-800"/>
          <select value={period} onChange={e=>setPeriod(e.target.value)} className="px-3 py-2 rounded-2xl bg-slate-100 dark:bg-slate-800">
            <option value="day">täglich</option>
            <option value="week">wöchentlich</option>
          </select>
          <input type="number" min="1" value={goal} onChange={e=>setGoal(e.target.value)} className="px-3 py-2 rounded-2xl bg-slate-100 dark:bg-slate-800 w-20"/>
          <input type="color" value={color} onChange={e=>setColor(e.target.value)} className="w-12 h-12 rounded-xl"/>
          <button className="px-4 py-2 rounded-2xl bg-sky-600 text-white">Hinzufügen</button>
        </form>
      )
    }

    function ProgressBar({value,max,color}){
      const pct=Math.min(100,Math.round((value/max)*100));
      return <div className="w-full h-3 bg-slate-200 dark:bg-slate-700 rounded-xl"><div style={{width:pct+'%',background:color}} className="h-3 rounded-xl"></div></div>
    }

    function Calendar({habit}){
      const days=30; const cells=[];
      for(let i=days-1;i>=0;i--){
        const d=fmt(dateAdd(new Date(),-i));
        const done=(habit.logs?.[d]||0)>=habit.goal;
        cells.push(<div key={d} className={"calendar-cell rounded "+(done?"bg-emerald-500":"bg-slate-300 dark:bg-slate-700")}></div>);
      }
      return <div className="flex flex-wrap gap-1">{cells}</div>
    }

    function HabitCard({habit,onLog,onArchive}){
      const today=todayISO(); const count=habit.logs?.[today]||0;
      return (
        <div className="rounded-3xl p-4 bg-white/70 dark:bg-slate-800/60 glass">
          <div className="flex justify-between">
            <div className="font-semibold">{habit.name}</div>
            <div className="flex gap-2">
              <button onClick={()=>onLog(habit.id,-1)} className="px-2 py-1 bg-slate-200 dark:bg-slate-700 rounded">-</button>
              <span className="min-w-[2rem] text-center">{count}</span>
              <button onClick={()=>onLog(habit.id,1)} className="px-2 py-1 bg-slate-200 dark:bg-slate-700 rounded">+</button>
            </div>
          </div>
          <div className="mt-2"><ProgressBar value={count} max={habit.goal} color={habit.color}/></div>
          <div className="mt-2"><Calendar habit={habit}/></div>
          <button onClick={()=>onArchive(habit.id)} className="mt-2 px-3 py-1 bg-rose-600 text-white rounded">Archivieren</button>
        </div>
      )
    }

    function App(){
      const [state,setState]=useState(loadState());
      useEffect(()=>saveState(state),[state]);
      const addHabit=h=>setState(s=>({...s,habits:[h,...s.habits]}));
      const log=(id,delta)=>setState(s=>({...s,habits:s.habits.map(h=>{
        if(h.id!==id)return h; const d=todayISO(); const logs={...(h.logs||{})};
        logs[d]=clamp((logs[d]||0)+delta,0,999); return {...h,logs};
      })}));
      const archive=id=>setState(s=>({...s,habits:s.habits.map(h=>h.id===id?{...h,archived:!h.archived}:h)}));
      return (
        <div className="h-full flex flex-col">
          <header className="p-4 flex justify-between items-center glass">
            <div className="font-bold text-xl">OpenHabit</div>
            <ThemeController settings={state.settings} setSettings={fn=>setState(s=>({...s,settings:fn(s.settings)}))}/>
          </header>
          <main className="p-4 space-y-4 flex-1 overflow-y-auto">
            <HabitForm onCreate={addHabit}/>
            <div className="grid md:grid-cols-2 gap-4">
              {state.habits.filter(h=>!h.archived).map(h=><HabitCard key={h.id} habit={h} onLog={log} onArchive={archive}/>)}
            </div>
          </main>
          <footer className="p-4 text-sm text-center opacity-70">© {new Date().getFullYear()} OpenHabit – MIT License</footer>
        </div>
      )
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

    if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js'));}
  </script>
</body>
</html>
