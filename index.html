<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Futuristischer Aufgabenmanager</title>
<style>
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: #0f0f1a;
        color: #e0e0f0;
        margin: 0;
        padding: 0;
    }
    header {
        background: linear-gradient(90deg, #00ffff, #ff00ff);
        padding: 1rem;
        text-align: center;
        font-size: 1.8rem;
        font-weight: bold;
        letter-spacing: 2px;
        color: #fff;
    }
    main {
        display: flex;
        flex-wrap: wrap;
        padding: 1rem;
        gap: 1rem;
    }
    section {
        background: #1a1a2e;
        border-radius: 12px;
        padding: 1rem;
        flex: 1 1 300px;
        min-width: 300px;
        max-width: 600px;
    }
    h2 {
        border-bottom: 1px solid #444;
        padding-bottom: 0.5rem;
    }
    input, textarea, select, button {
        width: 100%;
        margin: 0.5rem 0;
        padding: 0.5rem;
        border-radius: 8px;
        border: none;
        background: #222;
        color: #fff;
    }
    button {
        cursor: pointer;
        background: linear-gradient(90deg, #00ffff, #ff00ff);
        color: #000;
        font-weight: bold;
    }
    ul {
        list-style: none;
        padding: 0;
    }
    li {
        background: #111;
        margin: 0.5rem 0;
        padding: 0.5rem;
        border-radius: 8px;
    }
    .task-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .tag {
        background: #00ffff;
        color: #000;
        padding: 0.2rem 0.5rem;
        border-radius: 4px;
        font-size: 0.8rem;
        margin-left: 0.3rem;
    }
    .calendar {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 0.5rem;
    }
    .calendar div {
        background: #111;
        padding: 0.5rem;
        border-radius: 8px;
        min-height: 60px;
    }
    .pomodoro {
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    .pomodoro-timer {
        font-size: 2rem;
        margin: 1rem 0;
    }
    .subtasks {
        margin-left: 1rem;
    }
</style>
</head>
<body>
<header>Futuristischer Aufgabenmanager</header>
<main>
    <!-- Aufgabenverwaltung -->
    <section id="tasks-section">
        <h2>Aufgaben</h2>
        <input type="text" id="task-title" placeholder="Titel">
        <textarea id="task-desc" placeholder="Beschreibung"></textarea>
        <input type="date" id="task-date">
        <input type="time" id="task-time">
        <select id="task-priority">
            <option value="Hoch">Hoch</option>
            <option value="Mittel">Mittel</option>
            <option value="Niedrig">Niedrig</option>
        </select>
        <input type="text" id="task-tags" placeholder="Tags, kommasepariert">
        <select id="task-recurring">
            <option value="none">Keine Wiederholung</option>
            <option value="daily">Täglich</option>
            <option value="weekly">Wöchentlich</option>
            <option value="monthly">Monatlich</option>
        </select>
        <input type="text" id="task-subtasks" placeholder="Unteraufgaben, kommasepariert">
        <button onclick="addTask()">Aufgabe hinzufügen</button>
        <ul id="task-list"></ul>
    </section>

    <!-- Kalenderansicht -->
    <section id="calendar-section">
        <h2>Kalender</h2>
        <div class="calendar" id="calendar-grid"></div>
    </section>

    <!-- Pomodoro -->
    <section id="pomodoro-section">
        <h2>Pomodoro-Timer</h2>
        <div class="pomodoro">
            <div class="pomodoro-timer" id="pomodoro-timer">25:00</div>
            <button onclick="startPomodoro()">Start</button>
            <button onclick="resetPomodoro()">Reset</button>
        </div>
    </section>

    <!-- Gewohnheiten / Habit Tracker -->
    <section id="habit-section">
        <h2>Gewohnheiten</h2>
        <input type="text" id="habit-name" placeholder="Gewohnheit hinzufügen">
        <button onclick="addHabit()">Hinzufügen</button>
        <ul id="habit-list"></ul>
    </section>
</main>

<script>
    // --- LocalStorage Laden ---
    let tasks = JSON.parse(localStorage.getItem('tasks') || '[]');
    let habits = JSON.parse(localStorage.getItem('habits') || '[]');

    const taskList = document.getElementById('task-list');
    const habitList = document.getElementById('habit-list');

    function saveTasks() {
        localStorage.setItem('tasks', JSON.stringify(tasks));
        renderTasks();
        renderCalendar();
    }

    function saveHabits() {
        localStorage.setItem('habits', JSON.stringify(habits));
        renderHabits();
    }

    // --- Aufgaben ---
    function addTask() {
        const title = document.getElementById('task-title').value;
        const desc = document.getElementById('task-desc').value;
        const date = document.getElementById('task-date').value;
        const time = document.getElementById('task-time').value;
        const priority = document.getElementById('task-priority').value;
        const tags = document.getElementById('task-tags').value.split(',').map(t=>t.trim()).filter(t=>t);
        const recurring = document.getElementById('task-recurring').value;
        const subtasks = document.getElementById('task-subtasks').value.split(',').map(t=>t.trim()).filter(t=>t);

        if(!title) return alert('Titel eingeben');

        tasks.push({title, desc, date, time, priority, tags, recurring, subtasks});
        saveTasks();

        // Felder zurücksetzen
        ['task-title','task-desc','task-date','task-time','task-tags','task-subtasks','task-recurring'].forEach(id=>{
            document.getElementById(id).value='';
        });
    }

    function deleteTask(index){
        if(confirm('Aufgabe löschen?')){
            tasks.splice(index,1);
            saveTasks();
        }
    }

    function renderTasks(){
        taskList.innerHTML='';
        tasks.forEach((t,i)=>{
            const li = document.createElement('li');
            li.innerHTML = `
                <div class="task-header">
                    <strong>${t.title}</strong>
                    <span>${t.priority}</span>
                </div>
                <div>${t.desc}</div>
                <div>${t.date} ${t.time}</div>
                <div>${t.tags.map(tag=>`<span class="tag">${tag}</span>`).join('')}</div>
                ${t.subtasks.length>0?`<ul class="subtasks">${t.subtasks.map(st=>`<li>${st}</li>`).join('')}</ul>`:''}
                <div>Wiederholung: ${t.recurring==='none'?'Keine':t.recurring}</div>
                <button onclick="deleteTask(${i})">Löschen</button>
            `;
            taskList.appendChild(li);
        });
    }

    // --- Kalender (Monatsansicht) ---
    function renderCalendar(){
        const grid = document.getElementById('calendar-grid');
        grid.innerHTML='';
        const today = new Date();
        const year = today.getFullYear();
        const month = today.getMonth();
        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month+1, 0).getDate();

        for(let i=0;i<firstDay;i++){
            const empty = document.createElement('div');
            grid.appendChild(empty);
        }

        for(let d=1; d<=daysInMonth; d++){
            const dayDiv = document.createElement('div');
            dayDiv.innerHTML=`<strong>${d}</strong>`;
            const dayStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;

            tasks.forEach(t=>{
                let add = false;
                if(t.date===dayStr) add=true;
                else if(t.recurring==='daily') add=true;
                else if(t.recurring==='weekly'){
                    const taskDay = new Date(t.date).getDay();
                    const currDay = new Date(year, month, d).getDay();
                    if(taskDay===currDay) add=true;
                }
                else if(t.recurring==='monthly'){
                    const taskDate = new Date(t.date).getDate();
                    if(taskDate===d) add=true;
                }
                if(add){
                    const tDiv = document.createElement('div');
                    tDiv.textContent = `${t.title} (${t.time})`;
                    tDiv.style.background='#00ffff';
                    tDiv.style.color='#000';
                    tDiv.style.marginTop='2px';
                    tDiv.style.borderRadius='4px';
                    tDiv.style.padding='2px';
                    dayDiv.appendChild(tDiv);
                }
            });

            grid.appendChild(dayDiv);
        }
    }

    // --- Pomodoro Timer ---
    let pomodoroTime=25*60;
    let pomodoroInterval=null;
    const pomodoroDisplay=document.getElementById('pomodoro-timer');

    function startPomodoro(){
        if(pomodoroInterval) return;
        pomodoroInterval=setInterval(()=>{
            pomodoroTime--;
            const m=Math.floor(pomodoroTime/60).toString().padStart(2,'0');
            const s=(pomodoroTime%60).toString().padStart(2,'0');
            pomodoroDisplay.textContent=`${m}:${s}`;
            if(pomodoroTime<=0){
                clearInterval(pomodoroInterval);
                pomodoroInterval=null;
                alert('Pomodoro beendet!');
                pomodoroTime=25*60;
                pomodoroDisplay.textContent='25:00';
            }
        },1000);
    }

    function resetPomodoro(){
        clearInterval(pomodoroInterval);
        pomodoroInterval=null;
        pomodoroTime=25*60;
        pomodoroDisplay.textContent='25:00';
    }

    // --- Habit Tracker ---
    function addHabit(){
        const name = document.getElementById('habit-name').value;
        if(!name) return;
        habits.push({name, completed: false});
        saveHabits();
        document.getElementById('habit-name').value='';
    }

    function toggleHabit(index){
        habits[index].completed=!habits[index].completed;
        saveHabits();
    }

    function deleteHabit(index){
        habits.splice(index,1);
        saveHabits();
    }

    function renderHabits(){
        habitList.innerHTML='';
        habits.forEach((h,i)=>{
            const li=document.createElement('li');
            li.innerHTML=`
                <input type="checkbox" ${h.completed?'checked':''} onclick="toggleHabit(${i})">
                ${h.name}
                <button onclick="deleteHabit(${i})">Löschen</button>
            `;
            habitList.appendChild(li);
        });
    }

    renderTasks();
    renderHabits();
    renderCalendar();
</script>
</body>
</html>
