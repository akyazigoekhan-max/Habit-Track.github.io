
<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenTasks</title>
    <link rel="manifest" href="/public/manifest.webmanifest">
    <style>
      :root{ --bg:#0b0f19; --panel:#111827; --muted:#6b7280; --text:#f9fafb; --accent:#38bdf8; --accent-2:#22c55e; --danger:#ef4444; --border:#1f2937; }
      *{box-sizing:border-box} html,body,#root{height:100%}
      body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 ui-sans-serif,system-ui,sans-serif}
      .container{max-width:1100px;margin:0 auto;padding:24px}
      .row{display:flex;gap:16px;align-items:center}
      .btn{padding:8px 12px;border-radius:10px;border:1px solid var(--border);background:#0f172a;color:var(--text);cursor:pointer}
      .btn:hover{filter:brightness(1.05)}
      .btn.primary{background:var(--accent);border-color:transparent;color:#0b1220}
      .btn.success{background:var(--accent-2);border-color:transparent;color:#06110a}
      .btn.danger{background:var(--danger);border-color:transparent;color:#17090a}
      .input, select{background:#0f172a;border:1px solid var(--border);color:var(--text);border-radius:10px;padding:8px 10px}
      .card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:0 6px 16px rgba(0,0,0,.25)}
      .muted{color:var(--muted)} .tabs{display:flex;gap:10px;border-bottom:1px solid var(--border);margin-bottom:16px}
      .tab{padding:8px 12px;border-radius:10px 10px 0 0;cursor:pointer}
      .tab.active{background:#0f172a;border:1px solid var(--border);border-bottom-color:transparent}
      .grid{display:grid;gap:12px} .grid.cols-2{grid-template-columns:1fr 1fr} .grid.cols-3{grid-template-columns:2fr 1fr 1fr}
      .chip{padding:2px 8px;border-radius:999px;background:#0f172a;border:1px solid var(--border);font-size:12px}
      .list{display:grid;gap:8px} .kpi{display:flex;flex-direction:column;gap:6px;background:#0f172a;border:1px solid var(--border);border-radius:12px;padding:10px}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
