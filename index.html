<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenHabit Web</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {},
        },
      };
    </script>

    <!-- React & ReactDOM über CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Lucide Icons (wie in shadcn/ui) -->
    <script src="https://unpkg.com/lucide-react@latest/dist/umd/lucide-react.min.js"></script>
  </head>
  <body class="bg-background text-foreground min-h-screen">
    <div id="root"></div>

    <script type="text/babel">

      const { useState, useEffect } = React;

      // Beispiel eines shadcn-ähnlichen Cards
      function Card({ title, children }) {
        return (
          <div className="rounded-xl border bg-card text-card-foreground shadow p-4 mb-4">
            <h2 className="text-lg font-semibold mb-2">{title}</h2>
            {children}
          </div>
        );
      }

      // Habit Tracker mit Unterpunkten
      function HabitTracker() {
        const [habits, setHabits] = useState(() => {
          const saved = localStorage.getItem("habits");
          return saved ? JSON.parse(saved) : [];
        });
        const [input, setInput] = useState("");

        useEffect(() => {
          localStorage.setItem("habits", JSON.stringify(habits));
        }, [habits]);

        const addHabit = () => {
          if (!input) return;
          setHabits([...habits, { name: input, sub: [] }]);
          setInput("");
        };

        const addSub = (i, subName) => {
          if (!subName) return;
          const newHabits = [...habits];
          newHabits[i].sub.push({ name: subName, done: false });
          setHabits(newHabits);
        };

        return (
          <Card title="Gewohnheiten">
            <div className="flex gap-2 mb-4">
              <input
                value={input}
                onChange={e => setInput(e.target.value)}
                className="border rounded px-2 py-1 flex-grow"
                placeholder="Neue Gewohnheit..."
              />
              <button onClick={addHabit} className="px-3 py-1 bg-primary text-white rounded">
                Hinzufügen
              </button>
            </div>
            <ul className="space-y-3">
              {habits.map((h, i) => (
                <li key={i} className="border rounded p-2">
                  <div className="font-semibold">{h.name}</div>
                  <SubList habit={h} onAdd={name => addSub(i, name)} />
                </li>
              ))}
            </ul>
          </Card>
        );
      }

      function SubList({ habit, onAdd }) {
        const [subName, setSubName] = useState("");
        const [subs, setSubs] = useState(habit.sub);

        const toggle = idx => {
          const newSubs = [...subs];
          newSubs[idx].done = !newSubs[idx].done;
          setSubs(newSubs);
        };

        useEffect(() => {
          habit.sub = subs;
        }, [subs]);

        return (
          <div className="mt-2 ml-4">
            <div className="flex gap-2 mb-2">
              <input
                value={subName}
                onChange={e => setSubName(e.target.value)}
                className="border rounded px-2 py-1 flex-grow"
                placeholder="Unterpunkt..."
              />
              <button
                onClick={() => {
                  onAdd(subName);
                  setSubs([...subs, { name: subName, done: false }]);
                  setSubName("");
                }}
                className="px-2 bg-secondary text-white rounded"
              >
                +
              </button>
            </div>
            <ul>
              {subs.map((s, idx) => (
                <li key={idx} className="flex items-center gap-2">
                  <input type="checkbox" checked={s.done} onChange={() => toggle(idx)} />
                  <span className={s.done ? "line-through" : ""}>{s.name}</span>
                </li>
              ))}
            </ul>
          </div>
        );
      }

      // Timer (Stoppuhr mit Pausen)
      function Timer() {
        const [time, setTime] = useState(0);
        const [running, setRunning] = useState(false);

        useEffect(() => {
          let interval;
          if (running) {
            interval = setInterval(() => setTime(t => t - 1), 1000);
          }
          return () => clearInterval(interval);
        }, [running]);

        useEffect(() => {
          if (time === 0 && running) {
            setRunning(false);
            alert("Zeit abgelaufen!");
          }
        }, [time, running]);

        return (
          <Card title="Stoppuhr">
            <div className="flex flex-col items-center gap-3">
              <div className="text-3xl">{time}s</div>
              <div className="flex gap-2">
                <button onClick={() => setRunning(!running)} className="px-3 py-1 bg-primary text-white rounded">
                  {running ? "Pause" : "Start"}
                </button>
                <button onClick={() => { setTime(1500); setRunning(false); }} className="px-3 py-1 bg-secondary text-white rounded">
                  Reset (25min)
                </button>
              </div>
            </div>
          </Card>
        );
      }

      function App() {
        return (
          <div className="container mx-auto max-w-2xl py-6">
            <h1 className="text-2xl font-bold mb-6">🌱 OpenHabit</h1>
            <HabitTracker />
            <Timer />
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);

    </script>
  </body>
</html>
